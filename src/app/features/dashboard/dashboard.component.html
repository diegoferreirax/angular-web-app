<div
  style="
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  "
>
  @for (item of dashboardService.dashboardsItems; track item) {
    <mat-card appearance="outlined">
      <mat-card-header>
        <mat-icon mat-card-avatar>{{ item.icon }}</mat-icon>
        <mat-card-title>{{ item.title }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <p>{{ item.value }}</p>
      </mat-card-content>
      @if (item.routerLink) {
        <mat-card-footer>
          <mat-chip-set
            aria-label="Ver clientes"
            style="padding: 16px"
            [routerLink]="item.routerLink"
          >
            <mat-chip>{{ item.routerName }}</mat-chip>
          </mat-chip-set>
        </mat-card-footer>
      }
    </mat-card>
  }
</div>
