<div class="container">
  <div>Lista de clientes cadastrados</div>
  <mat-divider></mat-divider>

  <section class="client-container flex mat-shadow-2" tabindex="0">
    <table
      mat-table
      matSort
      [dataSource]="dataSource"
      (matSortChange)="sortClientChange($event)"
    >
      @for (column of dataColumns; track column) {
        <ng-container matColumnDef="{{ column }}">
          <th
            mat-header-cell
            *matHeaderCellDef
            mat-sort-header
            [sortActionDescription]="'Ordenar por ' + columnLabels[column]"
          >
            {{ columnLabels[column] }}
          </th>
          <td
            mat-cell
            *matCellDef="let element"
            [attr.data-label]="columnLabels[column]"
            [class.mobile-name]="column === 'name'"
            [class.mobile-cpf]="column === 'cpf'"
          >
            {{ element[column] }}
          </td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="dataColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: dataColumns"></tr>
      <tr class="mat-mdc-no-data-row" *matNoDataRow>
        @if (clientController.getClientsResponse().isLoading) {
          <td>
            <div class="flex-align-justify" style="gap: 8px;">
              <div>Carregando...</div>
              <div><mat-spinner diameter="24"></mat-spinner></div>
            </div>
          </td>
        } @else {
          <td [attr.colspan]="dataColumns.length || 1">
            <div class="flex-align-justify" style="gap: 8px;">
            Nenhum cliente cadastrado.
            </div>
          </td>
        }
      </tr>
    </table>
  </section>

  <mat-paginator
    [pageSizeOptions]="[10, 30, 50]"
    showFirstLastButtons
    aria-label="Select page of periodic elements"
  ></mat-paginator>
</div>
